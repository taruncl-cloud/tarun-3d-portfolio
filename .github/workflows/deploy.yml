name: Build 3D Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Tarun-3D-Portfolio

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Tarun-3D-Portfolio/package.json

      - name: Install dependencies
        run: npm install

      - name: Build portfolio
        run: npm run build

      - name: Upload website build
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: Tarun-3D-Portfolio/dist/
